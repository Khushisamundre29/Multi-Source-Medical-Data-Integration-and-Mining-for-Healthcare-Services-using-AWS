{% extends "base.html" %}
{% block title %}Doctor Login — HealthCare{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-image">
    <img src="https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?w=900&q=80" alt="Doctor">
    <div class="auth-image-overlay">
      <h2>Doctor Portal</h2>
      <p>Login to view appointments and manage patient requests.</p>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-form-wrap">
      <a href="{{ url_for('index') }}" class="back-link">← Back to home</a>
      <h2>Doctor Login</h2>
      <p class="subtitle">Enter your registered credentials to continue.</p>
      <form action="{{ url_for('doctorlogin') }}" method="post">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input class="form-control" type="text" name="name" placeholder="Dr. First Last" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="pwd" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Login</button>
        <p class="form-footer">New here? <a href="{{ url_for('doctor') }}">Register as doctor</a></p>
      </form>
    </div>
  </div>
</div>
{% endblock %}
