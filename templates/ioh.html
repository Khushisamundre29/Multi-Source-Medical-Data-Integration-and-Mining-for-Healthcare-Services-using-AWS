{% extends "base.html" %}
{% block title %}IOH Login — HealthCare{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-image">
    <img src="https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=900&q=80" alt="Medicines">
    <div class="auth-image-overlay">
      <h2>Internet of Health</h2>
      <p>Manage medicine data and support the healthcare ecosystem.</p>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-form-wrap">
      <a href="{{ url_for('index') }}" class="back-link">← Back to home</a>
      <h2>IOH Login</h2>
      <p class="subtitle">Login with your IOH credentials.</p>
      <form action="{{ url_for('ioh') }}" method="post">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-control" type="text" name="name" placeholder="IOH" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="pwd" placeholder="IOH" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Login to IOH</button>
      </form>
      <p style="margin-top:1.25rem;font-size:0.8rem;color:var(--text-muted);text-align:center;">
        Default: Username <strong>IOH</strong> / Password <strong>IOH</strong>
      </p>
    </div>
  </div>
</div>
{% endblock %}
