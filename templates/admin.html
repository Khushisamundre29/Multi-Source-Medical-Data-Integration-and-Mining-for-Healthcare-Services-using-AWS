{% extends "base.html" %}
{% block title %}Admin Login — HealthCare{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-image">
    <img src="https://images.unsplash.com/photo-1551190822-a9333d879b1f?w=900&q=80" alt="Admin">
    <div class="auth-image-overlay">
      <h2>Admin Control Panel</h2>
      <p>Manage doctors, patients, medicines, and appointments.</p>
    </div>
  </div>
  <div class="auth-form-side">
    <div class="auth-form-wrap">
      <a href="{{ url_for('index') }}" class="back-link">← Back to home</a>
      <h2>Admin Login</h2>
      <p class="subtitle">Enter your credentials to access the admin panel.</p>
      <form action="{{ url_for('admin') }}" method="post">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-control" type="text" name="name" placeholder="Enter your username" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="pwd" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Login to Dashboard</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
